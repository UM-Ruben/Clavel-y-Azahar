project_id = "floristeria"

[auth]
enable_signup = false
site_url = "https://www.clavelyazahar.es"
additional_redirect_urls = [
  "https://www.clavelyazahar.es/naniPanel",
  "https://clavelyazahar.es/naniPanel",
  "http://localhost:5173/naniPanel",
  "http://127.0.0.1:5173/naniPanel",
]

[auth.email]
# Mantiene disponible el acceso y la recuperación por email. El alta de nuevas
# cuentas sigue bloqueada por `auth.enable_signup = false` arriba.
enable_signup = true

[functions.publish-photo]
verify_jwt = false

[functions.cleanup-media]
verify_jwt = false

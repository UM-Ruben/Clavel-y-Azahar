<!DOCTYPE html>
<html lang="es-ES">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#061b0e" />

    <!-- ====================================================================
         El title, la meta description, el canonical y og:title/description/url
         se generan POR RUTA con el componente <Seo> (src/components/Seo.jsx).
         Aquí solo viven las etiquetas GLOBALes comunes a todas las páginas.
         Recuerda mantener estos placeholders (dominio, ciudad) coherentes con
         src/config/site.js.
         ==================================================================== -->

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- TODO: añade un apple-touch-icon.png de 180x180 en /public y descomenta:
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" /> -->

    <!-- Open Graph (globales) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Clavel y Azahar" />
    <!-- TODO: sube una imagen 1200x630 a /public/og-image.jpg -->
    <meta property="og:image" content="https://www.tudominio.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X (globales; el título/descr. caen por defecto a los de Open Graph) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.tudominio.com/og-image.jpg" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols: solo los iconos usados (≈2 KB en vez de ~300 KB) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@24,400,0..1&icon_names=arrow_forward,call,chat,check_circle,directions,location_on,schedule,search,spa,storefront&display=swap"
      rel="stylesheet"
    />

    <!-- ====================================================================
         DATOS ESTRUCTURADOS (SEO local) — clave para aparecer en Google Maps
         y en «floristería cerca de mí». Sustituye los placeholders por los
         datos reales e IDÉNTICOS a los de tu Google Business Profile.
         Valida en: https://search.google.com/test/rich-results
         ==================================================================== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Florist",
        "name": "Clavel y Azahar",
        "slogan": "El nuevo aroma de Entrerramblas",
        "alternateName": "Floristería Entrerramblas",
        "image": "https://www.tudominio.com/og-image.jpg",
        "url": "https://www.tudominio.com/",
        "telephone": "+34912345678",
        "priceRange": "€€",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Calle Pendiente de confirmar, s/n",
          "addressLocality": "Los Ramos",
          "postalCode": "30589",
          "addressRegion": "Murcia",
          "addressCountry": "ES"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 37.949,
          "longitude": -1.041
        },
        "areaServed": ["Los Ramos", "Murcia"],
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "09:00",
            "closes": "20:00"
          }
        ],
        "sameAs": [
          "https://instagram.com/tu_floristeria",
          "https://facebook.com/tu_floristeria"
        ]
      }
    </script>
  </head>
  <body class="bg-surface text-on-surface">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
